<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="navyShieldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f2744" />
      <stop offset="50%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#050b14" />
    </linearGradient>
    <linearGradient id="bannerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <!-- Filter for subtle drop shadow -->
    <filter id="shieldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- External Gold Halo / Ring -->
  <circle cx="160" cy="160" r="150" fill="none" stroke="url(#goldGradient)" stroke-width="3" stroke-dasharray="8 4" opacity="0.6"/>
  <circle cx="160" cy="160" r="144" fill="#070e1a" stroke="url(#goldGradient)" stroke-width="2"/>

  <!-- Arch Text -->
  <path id="archTextPath" d="M 40 160 A 120 120 0 0 1 280 160" fill="none"/>
  <text font-family="'Cinzel', 'Georgia', serif" font-size="11" font-weight="700" fill="#fde68a" letter-spacing="2">
    <textPath href="#archTextPath" startOffset="50%" text-anchor="middle">
      SEMINARIO SANTO TOMÁS DE AQUINO
    </textPath>
  </text>

  <!-- Arch Subtext -->
  <path id="archSubTextPath" d="M 50 160 A 110 110 0 0 0 270 160" fill="none"/>
  <text font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#94a3b8" letter-spacing="3">
    <textPath href="#archSubTextPath" startOffset="50%" text-anchor="middle">
      ARQUIDIÓCESIS DE MARACAIBO
    </textPath>
  </text>

  <!-- Central Heraldic Shield -->
  <g filter="url(#shieldShadow)">
    <!-- Shield Outline -->
    <path d="M 110 80 L 210 80 Q 215 130 210 170 C 205 210 160 238 160 238 C 160 238 115 210 110 170 Q 105 130 110 80 Z"
          fill="url(#navyShieldGradient)" stroke="url(#goldGradient)" stroke-width="3.5"/>

    <!-- Shield Quarter Divisions -->
    <path d="M 160 80 L 160 238" stroke="url(#goldGradient)" stroke-width="1.5" opacity="0.7"/>
    <path d="M 110 148 L 210 148" stroke="url(#goldGradient)" stroke-width="1.5" opacity="0.7"/>

    <!-- Top Left: Star of St. Thomas Aquinas (Sol Veritatis) -->
    <g transform="translate(135, 114) scale(0.6)">
      <polygon points="0,-22 6,-7 22,-7 10,3 15,19 0,9 -15,19 -10,3 -22,-7 -6,-7" fill="url(#goldGradient)"/>
      <circle cx="0" cy="0" r="4" fill="#ffffff"/>
    </g>

    <!-- Top Right: Crossed Keys / Pastoral Staff -->
    <g transform="translate(185, 114) scale(0.6)">
      <!-- Mitre / Chalice symbol -->
      <path d="M -12 12 L 12 12 C 10 0 12 -12 0 -18 C -12 -12 -10 0 -12 12 Z" fill="none" stroke="url(#goldGradient)" stroke-width="2.5"/>
      <line x1="0" y1="-18" x2="0" y2="12" stroke="url(#goldGradient)" stroke-width="2"/>
      <circle cx="0" cy="-22" r="3" fill="#fbbf24"/>
    </g>

    <!-- Bottom: Book of Truth & Dominican Cross Motif -->
    <g transform="translate(160, 192) scale(0.7)">
      <!-- Open Book -->
      <path d="M -22 -6 Q -10 -12 0 -8 Q 10 -12 22 -6 L 22 14 Q 10 8 0 12 Q -10 8 -22 14 Z" fill="#ffffff" opacity="0.9" stroke="url(#goldGradient)" stroke-width="1.5"/>
      <line x1="0" y1="-8" x2="0" y2="12" stroke="#0a192f" stroke-width="1.5"/>
      <!-- Lines on pages -->
      <line x1="-16" y1="-2" x2="-4" y2="-2" stroke="#0f2744" stroke-width="1"/>
      <line x1="-16" y1="3" x2="-4" y2="3" stroke="#0f2744" stroke-width="1"/>
      <line x1="-16" y1="8" x2="-4" y2="8" stroke="#0f2744" stroke-width="1"/>
      <line x1="4" y1="-2" x2="16" y2="-2" stroke="#0f2744" stroke-width="1"/>
      <line x1="4" y1="3" x2="16" y2="3" stroke="#0f2744" stroke-width="1"/>
      <line x1="4" y1="8" x2="16" y2="8" stroke="#0f2744" stroke-width="1"/>
    </g>
  </g>

  <!-- Bottom Motto Banner: SACERDOS LUX -->
  <g transform="translate(0, 18)">
    <path d="M 85 240 L 95 230 L 225 230 L 235 240 L 225 250 L 95 250 Z"
          fill="url(#bannerGradient)" stroke="#78350f" stroke-width="1.5" filter="url(#shieldShadow)"/>
    <!-- Banner fold shadows -->
    <polygon points="95,250 102,250 102,256" fill="#78350f"/>
    <polygon points="225,250 218,250 218,256" fill="#78350f"/>
    <text x="160" y="244" font-family="'Cinzel', serif" font-size="10.5" font-weight="900" fill="#0a192f" text-anchor="middle" letter-spacing="2.5">
      SACERDOS LUX
    </text>
  </g>
</svg>
